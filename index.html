<title>健身資源庫</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--tx:#f2f4f8;--mu:#9aa3b2;--ac:#ff6b35;--bd:#2a2f3a}
@media(prefers-color-scheme:light){:root{--bg:#f4f5f8;--card:#fff;--tx:#14171d;--mu:#667085;--bd:#e3e6ec}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;line-height:1.6}
body{padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px)}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:26px;margin:20px 0 4px}h2{font-size:20px;margin:0}h3{font-size:15px;margin:18px 0 6px;color:var(--ac)}
.sub{color:var(--mu);font-size:14px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.part{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px 14px;text-align:center;cursor:pointer}
.part:active,.item:active{transform:scale(.97)}
.part .e{font-size:34px}.part b{display:block;font-size:17px;margin-top:4px}.part span{font-size:12px;color:var(--mu)}
.back{display:inline-block;color:var(--ac);padding:14px 0 4px;cursor:pointer;font-size:15px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin:10px 0;cursor:pointer}
.item .th{width:96px;height:80px;flex:none;border-radius:10px;background:var(--bg)}
.item b{font-size:16px}.item small{display:block;color:var(--mu);font-size:12px}
.demo{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin:12px 0}
.demo svg{width:100%;display:block}
.sc{stroke:var(--mu);fill:var(--mu);opacity:.45;stroke-linecap:round}.cb{stroke:var(--mu);opacity:.7}
.bd{stroke:var(--ac);fill:none;opacity:.5;stroke-linecap:round}.bd .hd{fill:var(--ac);stroke:none}
.sk{stroke:var(--tx);fill:var(--tx);opacity:.85;stroke-linecap:round}.eq{fill:var(--tx);opacity:.9}
.tag{display:inline-block;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:2px 10px;font-size:12px;margin:0 6px 6px 0;color:var(--mu)}
ol,ul{padding-left:22px;margin:4px 0}li{margin:5px 0}
.warn li::marker{color:#e5484d}
.links a{display:block;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin:8px 0;color:var(--tx);text-decoration:none;font-size:14px}
.foot{color:var(--mu);font-size:12px;margin-top:28px}
</style></head><body><div class="wrap" id="app"></div>

if(T.cb)s+='<g class="cb">'+l(wr,T.cb,1.5)+'</g>';
s+='<g class="bd">'+l(hip,nk,15)+l(nk,el,9)+l(el,wr,8)+l(hip,kn,12)+l(kn,ak,10)+l(ak,P(ak,[11,0]),7)+(T.bl?l(hip,[hip[0]-50,154],11):"")+`<circle class="hd" cx="${hd[0]}" cy="${hd[1]}" r="10"/></g>`;
s+='<g class="sk">'+[[hip,nk],[nk,el],[el,wr],[hip,kn],[kn,ak]].map(e=>l(e[0],e[1],1.5)).join("")+[hip,nk,el,wr,kn,ak].map(j=>`<circle cx="${j[0]}" cy="${j[1]}" r="2.6"/>`).join("")+'</g>';
if(T.eq)s+=`<circle class="eq" cx="${wr[0]}" cy="${wr[1]}" r="6"/>`;
return s}
function anim(sv,k){const t0=performance.now();(function f(n){if(!sv.isConnected)return;const u=((n-t0)%3200)/3200,r=u<.5?u*2:2-u*2;sv.innerHTML=draw(k,r*r*(3-2*r));timer=requestAnimationFrame(f)})(t0)}
function home(){cancelAnimationFrame(timer);app.innerHTML=`<h1>健身資源庫</h1><p class="sub">選擇訓練部位,查看器材用法與動作示範</p><div class="grid">${D.map(p=>`<div class="part" onclick="location.hash='#${p.k}'"><div class="e">${p.e}</div><b>${p.n}</b><span>${p.d}</span></div>`).join("")}</div><h3>參考資料來源</h3><div class="links">${SRC.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${s[0]} ↗</a>`).join("")}</div><p class="foot">動作內容僅供一般參考,有傷病或不確定時請諮詢醫師或合格教練。</p>`}
function part(k){cancelAnimationFrame(timer);const p=D.find(x=>x.k==k);app.innerHTML=`<div class="back" onclick="location.hash=''">‹ 返回</div><h2>${p.e} ${p.n}</h2><p class="sub">${p.d}</p>${p.x.map((x,i)=>`<div class="item" onclick="location.hash='#${k}/${i}'"><svg class="th" viewBox="0 -20 240 190">${draw(M[x.id],.5)}</svg><div><b>${x.n}</b><small>${x.eq}</small><small>主要:${x.m}</small></div></div>`).join("")}`}
function ex(k,i){const p=D.find(x=>x.k==k),x=p.x[i];const yt="https://www.youtube.com/results?search_query="+encodeURIComponent(x.q+" proper form tutorial");const yt2="https://www.youtube.com/results?search_query="+encodeURIComponent(x.n+" 教學 動作");
app.innerHTML=`<div class="back" onclick="location.hash='#${k}'">‹ ${p.n}</div><h2>${x.n}</h2><p class="sub">${x.q}</p><div class="demo"><svg id="dm" viewBox="0 -20 240 190"></svg></div><p class="foot" style="margin:0 0 8px;text-align:center">半透明人形動作示意(側面視角)</p><span class="tag">🏋️ ${x.eq}</span><span class="tag">🎯 ${x.m}</span><h3>動作步驟</h3><ol>${x.s.map(s=>`<li>${s}</li>`).join("")}</ol><h3>訣竅</h3><ul>${x.t.map(s=>`<li>${s}</li>`).join("")}</ul><h3>常見錯誤</h3><ul class="warn">${x.w.map(s=>`<li>${s}</li>`).join("")}</ul><h3>延伸影片教學</h3><div class="links"><a href="${yt}" target="_blank" rel="noopener">▶ YouTube:${x.q} 英文教學</a><a href="${yt2}" target="_blank" rel="noopener">▶ YouTube:${x.n} 中文教學</a></div>`;anim(document.getElementById("dm"),M[x.id])}
function route(){const h=location.hash.slice(1).split("/");scrollTo(0,0);if(!h[0])home();else if(h[1]!==undefined)ex(h[0],+h[1]);else part(h[0])}
addEventListener("hashchange",route);route();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
