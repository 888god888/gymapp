<title>健身資源庫</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--tx:#f2f4f8;--mu:#9aa3b2;--ac:#ff6b35;--bd:#2a2f3a}
@media(prefers-color-scheme:light){:root{--bg:#f4f5f8;--card:#fff;--tx:#14171d;--mu:#667085;--bd:#e3e6ec}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;line-height:1.6}
body{padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px)}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:26px;margin:20px 0 4px}h2{font-size:20px;margin:0}h3{font-size:15px;margin:18px 0 6px;color:var(--ac)}
.sub{color:var(--mu);font-size:14px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.part{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px 14px;text-align:center;cursor:pointer}
.part:active,.item:active{transform:scale(.97)}
.part .e{font-size:34px}.part b{display:block;font-size:17px;margin-top:4px}.part span{font-size:12px;color:var(--mu)}
.back{display:inline-block;color:var(--ac);padding:14px 0 4px;cursor:pointer;font-size:15px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin:10px 0;cursor:pointer}
.item .th{width:96px;height:80px;flex:none;border-radius:10px;background:var(--bg)}
.item b{font-size:16px}.item small{display:block;color:var(--mu);font-size:12px}
.demo{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin:12px 0}
.demo svg{width:100%;display:block}
.sc{stroke:var(--mu);fill:var(--mu);opacity:.45;stroke-linecap:round}.cb{stroke:var(--mu);opacity:.7}
.bd{stroke:var(--ac);fill:none;opacity:.5;stroke-linecap:round}.bd .hd{fill:var(--ac);stroke:none}
.vt{display:flex;gap:8px;margin:8px 0}.vt button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px}.vt .on{background:var(--ac);color:#fff;border-color:var(--ac)}.cap{font-size:13px;color:var(--mu);margin:4px 0 0}
.sk{stroke:var(--tx);fill:var(--tx);opacity:.85;stroke-linecap:round}.eq{fill:var(--tx);opacity:.9}
.tag{display:inline-block;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:2px 10px;font-size:12px;margin:0 6px 6px 0;color:var(--mu)}
ol,ul{padding-left:22px;margin:4px 0}li{margin:5px 0}
.warn li::marker{color:#e5484d}
.links a{display:block;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin:8px 0;color:var(--tx);text-decoration:none;font-size:14px}
.foot{color:var(--mu);font-size:12px;margin-top:28px}
</style></head><body><div class="wrap" id="app"></div>

{n:"T 槓划船",q:"T-Bar Row",id:"T-Bar_Row_with_Handle",eq:"T 槓划船機",m:"中背、背闊肌",s:["雙腳跨站在槓兩側,髖後推、背部中立。","握住握把,吐氣將槓拉向胸腹間。","夾緊肩胛 1 秒,控制放下。"],t:["胸貼墊的機型可降低下背負擔。"],w:["圓背、起身借力。"]},
{n:"直臂下壓",q:"Straight Arm Pulldown",id:"Straight-Arm_Pulldown",eq:"高位滑輪",m:"背闊肌(孤立)",s:["面向滑輪站立,握直槓,身體微前傾。","手臂微彎固定,把槓向下壓至大腿前。","緩慢放回至背闊肌有拉伸。"],t:["很適合感受背闊肌用力。"],w:["手臂彎曲變成三頭下壓。"]},
{n:"槓鈴硬舉",q:"Barbell Deadlift",id:"Barbell_Deadlift",eq:"槓鈴+槓片",m:"臀、腿後側、下背、全身",s:["脛骨貼近槓,雙腳與髖同寬,握槓在膝外側。","挺胸、背部中立、繃緊核心,先蹬地再伸髖。","站直後臀部夾緊,沿著大腿放下。"],t:["槓全程貼近身體,可穿平底鞋或赤腳。"],w:["圓背、用腰直接拉起。"]},
{n:"羅馬椅背伸展",q:"Back Extension",id:"Hyperextensions_Back_Extensions",eq:"羅馬椅",m:"下背、臀、腿後側",s:["髖部抵住墊子邊緣,雙腳固定,身體成一直線。","髖鉸鏈前彎下降,背部保持平直。","用臀與下背把身體抬回水平即可。"],t:["頂端到身體成一直線就停。"],w:["過度後仰,腰椎過伸。"]}],
shoulder:[
{n:"啞鈴肩推",q:"Dumbbell Shoulder Press",id:"Dumbbell_Shoulder_Press",eq:"啞鈴+可調椅",m:"三角肌、三頭",s:["坐姿,椅背約 80–90°,啞鈴置於肩側,手肘略前。","吐氣向上推起,啞鈴在頭頂稍靠攏。","吸氣控制下放至耳朵高度。"],t:["活動度比槓鈴更自由。"],w:["腰部過度反弓。"]},
{n:"阿諾推舉",q:"Arnold Press",id:"Arnold_Dumbbell_Press",eq:"啞鈴",m:"三角肌各束",s:["啞鈴置於胸前,掌心朝向自己。","向上推的同時旋轉手腕,頂端掌心朝前。","反向旋轉並下放回胸前。"],t:["用較輕重量。"],w:["旋轉時甩動借力。"]},
{n:"啞鈴前平舉",q:"Front Dumbbell Raise",id:"Front_Dumbbell_Raise",eq:"啞鈴",m:"前三角",s:["站姿,啞鈴置於大腿前。","手臂微彎,吐氣舉至約肩高。","緩慢放下。"],t:["臥推多的人前束已夠刺激,可降量。"],w:["身體後仰借力。"]},
{n:"蝴蝶機反向飛鳥",q:"Reverse Pec Deck Fly",id:"Reverse_Machine_Flyes",eq:"蝴蝶機(反向)",m:"後三角、中斜方",s:["面向椅背坐,握把與肩同高。","手肘微彎,向兩側後方打開。","夾緊肩胛 1 秒,緩慢回放。"],t:["輕重量、多次數。"],w:["聳肩、用手臂拉。"]},
{n:"槓鈴聳肩",q:"Barbell Shrug",id:"Barbell_Shrug",eq:"槓鈴",m:"上斜方肌",s:["雙手握槓於大腿前,站直。","吐氣把肩膀垂直向上聳向耳朵。","頂端停 1 秒,緩慢放下。"],t:["可改用啞鈴或史密斯機。"],w:["轉肩畫圓。"]},
{n:"機械肩推",q:"Machine Shoulder Press",id:"Machine_Shoulder_Military_Press",eq:"坐姿肩推機",m:"三角肌、三頭",s:["座椅調整至握把約與肩同高。","背貼椅背,向上推至手臂接近伸直。","緩慢放回。"],t:["軌道固定,適合新手與力竭組。"],w:["聳肩。"]}],
arm:[
{n:"錘式彎舉",q:"Hammer Curl",id:"Hammer_Curls",eq:"啞鈴",m:"肱肌、肱橈肌",s:["雙手持啞鈴,掌心相對(像握錘子)。","手肘固定,彎舉至肩前。","緩慢放下。"],t:["能讓手臂看起來更厚實。"],w:["身體前後擺動。"]},
{n:"牧師椅彎舉",q:"Preacher Curl",id:"Preacher_Curl",eq:"牧師椅+EZ 槓",m:"二頭肌",s:["上臂貼在斜墊上,腋下抵住邊緣。","彎舉至頂端,擠壓二頭。","緩慢放下,不完全鎖死。"],t:["可減少借力,孤立二頭。"],w:["底端過度伸直,肌腱承受壓力。"]},
{n:"窄握臥推",q:"Close Grip Bench Press",id:"Close-Grip_Barbell_Bench_Press",eq:"臥推架+槓鈴",m:"三頭、胸",s:["握距約與肩同寬,肩胛後收。","手肘貼近身體下放至下胸。","吐氣推起。"],t:["三頭最能用大重量的動作之一。"],w:["握太窄,手腕不適。"]},
{n:"雙槓臂屈伸(三頭)",q:"Triceps Dips",id:"Dips_-_Triceps_Version",eq:"雙槓/輔助機",m:"三頭",s:["雙手撐住,身體保持直立。","手肘向後、貼身下放至約 90°。","推起至手臂伸直。"],t:["身體越直越偏三頭。"],w:["下放太深傷肩。"]},
{n:"EZ 槓仰臥臂屈伸",q:"Skull Crusher",id:"EZ-Bar_Skullcrusher",eq:"EZ 槓+長凳",m:"三頭",s:["平躺,EZ 槓舉於胸上方。","上臂固定,屈肘讓槓降向額頭上方。","用三頭把槓推回起點。"],t:["使用保護或同伴協助。"],w:["手肘外開、上臂前後搖。"]},
{n:"繩索過頭三頭伸展",q:"Cable Overhead Triceps Extension",id:"Cable_Rope_Overhead_Triceps_Extension",eq:"低位滑輪+繩索",m:"三頭(長頭)",s:["背對滑輪,雙手握繩索置於頭後。","上臂貼耳固定,向前上方伸直手臂。","緩慢放回。"],t:["練長頭效果好。"],w:["手肘外張,腰過度後仰。"]}],
